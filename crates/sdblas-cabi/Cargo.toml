[package]
name = "sdblas-cabi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SoftBLAS-compatible C ABI over sdblas: a drop-in libsoftblas.a, also how SoftBLAS's own munit suite is run against the Rust port"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
doctest = false

[dependencies]
sdblas = { path = "../sdblas" }
