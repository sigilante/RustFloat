[package]
name = "sdblas"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust, no_std BLAS over sdfloat with explicit rounding modes, bit-identical to SoftBLAS except on overflow, which follows Hoon"
keywords = ["blas", "ieee754", "no_std", "deterministic"]
categories = ["mathematics", "no-std"]

[dependencies]
sdfloat = { path = "../sdfloat" }

[dev-dependencies]
sdblas-oracle = { path = "../sdblas-oracle" }
